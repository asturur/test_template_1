name: CI Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Quartus source manifest
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sh -t tools/check_quartus_sources.tcl

      # Quartus 17.0.2 (Cyclone V) in a container — same toolchain the .qsf
      # records (LAST_QUARTUS_VERSION "17.0.2"). Revision = Template (Template.qpf).
      # Tee the console so we keep the full log even when the compile fails;
      # PIPESTATUS preserves the real quartus_sh exit code through the pipe.
      - name: Build with Quartus 17.0.2
        id: compile
        run: |
          set -uo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile Template \
            2>&1 | tee quartus_build.log
          exit "${PIPESTATUS[0]}"

      - name: Export worst 1000 timing paths
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -uo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sta -t tools/report_quartus_timing.tcl Template 1000 \
            2>&1 | tee quartus_timing_details.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize path bottlenecks
        run: |
          python3 tools/summarize_quartus_paths.py output_files/timing/worst-setup.csv \
            --output output_files/timing/path-summary.md
          cat output_files/timing/path-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require passing timing
        run: python3 tools/check_quartus_timing.py output_files/Template.sta.rpt

      - name: Check build output
        run: test -f output_files/Template.rbf

      # Show the errors inline in the job log on failure, so the cause is
      # visible without downloading the artifact.
      - name: Print errors on failure
        if: failure()
        run: |
          echo "::group::Quartus errors and critical warnings"
          grep -hE "Error|Critical Warning" quartus_build.log output_files/*.rpt 2>/dev/null | head -500 || true
          echo "::endgroup::"
          echo "::group::Full build log (last 300 lines)"
          tail -300 quartus_build.log 2>/dev/null || true
          echo "::endgroup::"

      # Always keep the logs/reports (success: timing/fit review; failure: debug).
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-logs
          path: |
            quartus_build.log
            quartus_timing_details.log
            output_files/timing/
            output_files/*.rpt
            output_files/*.summary
            output_files/*.smsg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RBF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Template-rbf
          path: output_files/Template.rbf
          if-no-files-found: error
